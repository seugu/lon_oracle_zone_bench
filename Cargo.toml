[workspace]
members = ["program", "harness", "bench/common", "bench/runner"]
# `cargo run` without -p would be ambiguous otherwise: bench/runner has a bin too.
default-members = ["harness"]
exclude = ["methods/guest", "bench/guest"]
resolver = "2"

[workspace.dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", branch = "main" }
nssa = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std", "prove"] }
risc0-binfmt = "=3.0.5"
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
k256 = { version = "0.13.4", features = ["ecdsa", "schnorr"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
sha2 = "0.10"
anyhow = "1"
hex = "0.4"

# The RISC Zero forks are drop-in on the host and switch to zkVM accelerators
# when the target is `riscv32im-risc0-zkvm-elf`. Keeping the patch here means
# the host build and the guest build verify signatures with the same code.
[patch.crates-io]
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
